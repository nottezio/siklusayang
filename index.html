<style>
:root{
  --bg:#FDF2F8;
  --bg-soft:#FCE7F3;
  --card:#FFFFFF;
  --primary:#DB2777;
  --primary-dark:#9D174D;
  --primary-light:#FBCFE8;
  --primary-faint:#FDF2F8;
  --text:#1F1235;
  --text-muted:#6B5871;
  --border:#F5D8E5;
  --border-soft:#FCE7F3;
  --period:#E11D48;
  --period-bg:#FFE4E6;
  --fertile:#EA580C;
  --fertile-dark:#9A3412;
  --fertile-bg:#FFEDD5;
  --caution:#CA8A04;
  --caution-bg:#FEF08A;
  --safe:#059669;
  --safe-bg:#D1FAE5;
  --predicted:#2563EB;
  --predicted-bg:#DBEAFE;
  --unknown:#9CA3AF;
  --unknown-bg:#F3F4F6;
  --warning:#D97706;
  --warning-bg:#FEF3C7;
  --warning-border:#FCD34D;
  --danger:#DC2626;
  --danger-bg:#FEE2E2;
  --shadow-sm:0 1px 2px rgba(155,40,90,0.06);
  --shadow:0 2px 8px rgba(155,40,90,0.08);
  --shadow-lg:0 8px 24px rgba(155,40,90,0.12);
  --radius:14px;
  --radius-lg:20px;
  --radius-sm:10px;
  --font-display:"Cormorant Garamond","Playfair Display",Georgia,"Times New Roman",serif;
  --font-body:"Plus Jakarta Sans","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:var(--font-body)}
body{background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;overscroll-behavior-y:contain;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input[type="date"]{font-family:var(--font-body)}

/* App shell */
#app{
  max-width:480px;margin:0 auto;min-height:100vh;
  padding-top:env(safe-area-inset-top);
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
  position:relative;
}
.header{
  padding:18px 20px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.header-title{
  font-family:var(--font-display);
  font-size:28px;font-weight:600;letter-spacing:-0.01em;
  color:var(--primary-dark);
  line-height:1.1;
}
.header-sub{font-size:12px;color:var(--text-muted);letter-spacing:0.04em;text-transform:uppercase;margin-top:2px}
.header-logo{
  width:38px;height:38px;border-radius:12px;
  background:linear-gradient(135deg,#FB7185,#DB2777);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow);
  flex-shrink:0;
}

/* Bottom nav */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(255,255,255,0.92);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--border-soft);
  padding:8px 0 calc(8px + env(safe-area-inset-bottom));
  z-index:50;
}
.bottom-nav-inner{
  max-width:480px;margin:0 auto;
  display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
  padding:0 8px;
}
.nav-item{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 4px;border-radius:10px;
  color:var(--text-muted);
  transition:color 0.2s,background 0.2s;
}
.nav-item.active{color:var(--primary)}
.nav-item:active{background:var(--primary-faint)}
.nav-icon{width:22px;height:22px;display:block}
.nav-label{font-size:11px;font-weight:500;letter-spacing:0.01em}

/* Cards */
.card{
  background:var(--card);
  border-radius:var(--radius-lg);
  padding:18px;
  box-shadow:var(--shadow-sm);
  border:1px solid var(--border-soft);
}
.card + .card{margin-top:14px}
.card-title{
  font-family:var(--font-display);
  font-size:20px;font-weight:600;
  color:var(--primary-dark);
  margin-bottom:10px;
  letter-spacing:-0.01em;
}
.card-section{padding:0 20px}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 18px;border-radius:12px;
  font-weight:600;font-size:15px;
  transition:transform 0.1s,opacity 0.2s,background 0.2s;
  min-height:46px;
}
.btn:active{transform:scale(0.97)}
.btn-primary{background:var(--primary);color:white;box-shadow:var(--shadow)}
.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{background:var(--primary-light);color:var(--primary-dark)}
.btn-ghost{background:transparent;color:var(--primary)}
.btn-outline{background:white;color:var(--primary);border:1.5px solid var(--primary-light)}
.btn-danger{background:var(--danger-bg);color:var(--danger)}
.btn-block{width:100%}
.btn-sm{padding:8px 12px;font-size:13px;min-height:36px;border-radius:9px}
.btn:disabled{opacity:0.45;cursor:not-allowed}

/* Form */
.form-group{margin-bottom:14px}
.form-label{
  display:block;font-size:13px;font-weight:600;
  color:var(--text-muted);
  margin-bottom:6px;letter-spacing:0.01em;
}
.form-input{
  width:100%;padding:12px 14px;
  border:1.5px solid var(--border);
  border-radius:11px;
  background:white;font-size:15px;
  transition:border-color 0.2s;
  -webkit-appearance:none;appearance:none;
}
.form-input:focus{outline:none;border-color:var(--primary)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-help{font-size:12px;color:var(--text-muted);margin-top:4px}
.form-error{font-size:12px;color:var(--danger);margin-top:4px}

/* Banners */
.banner{
  display:flex;gap:10px;align-items:flex-start;
  padding:12px 14px;border-radius:12px;
  font-size:13px;line-height:1.45;
}
.banner-icon{flex-shrink:0;margin-top:1px}
.banner-warning{background:var(--warning-bg);color:#92400E;border:1px solid var(--warning-border)}
.banner-info{background:var(--predicted-bg);color:#1E40AF;border:1px solid #93C5FD}
.banner-success{background:var(--safe-bg);color:#065F46;border:1px solid #6EE7B7}
.banner-danger{background:var(--danger-bg);color:#991B1B;border:1px solid #FCA5A5}

/* Reliability meter */
.reliability{
  border-radius:var(--radius-lg);padding:14px 16px;
  margin-bottom:14px;
}
.reliability-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.reliability-status{font-weight:700;font-size:14px;letter-spacing:0.01em}
.reliability-variation{font-size:12px;font-weight:500;opacity:0.85}
.reliability-bar{height:6px;border-radius:3px;background:rgba(255,255,255,0.5);overflow:hidden;margin-bottom:8px}
.reliability-fill{height:100%;border-radius:3px;transition:width 0.4s}
.reliability-msg{font-size:12.5px;line-height:1.45}
.rel-green{background:#ECFDF5;color:#065F46;border:1px solid #6EE7B7}
.rel-green .reliability-fill{background:#10B981}
.rel-yellow{background:#FFFBEB;color:#92400E;border:1px solid #FCD34D}
.rel-yellow .reliability-fill{background:#F59E0B}
.rel-red{background:#FEF2F2;color:#991B1B;border:1px solid #FCA5A5}
.rel-red .reliability-fill{background:#EF4444}

/* Calendar */
.cal-nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 4px;margin-bottom:12px;
}
.cal-nav-btn{
  width:38px;height:38px;border-radius:50%;
  background:white;color:var(--primary);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-sm);
}
.cal-nav-btn:active{background:var(--primary-faint)}
.cal-month-title{
  font-family:var(--font-display);
  font-size:22px;font-weight:600;color:var(--primary-dark);
  letter-spacing:-0.01em;
}
.cal-grid{
  display:grid;grid-template-columns:repeat(7,1fr);
  gap:4px;
}
.cal-weekday{
  text-align:center;font-size:11px;font-weight:600;
  color:var(--text-muted);
  padding:6px 0;letter-spacing:0.06em;text-transform:uppercase;
}
.cal-weekday.weekend{color:var(--primary)}
.cal-cell{
  aspect-ratio:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  font-size:14px;font-weight:500;
  border-radius:10px;
  position:relative;
  overflow:hidden;
  transition:transform 0.1s;
  background:transparent;
  border:1.5px solid transparent;
  padding-bottom:3px;
}
.cal-day{line-height:1.1}
.cal-pct{font-size:9px;font-weight:700;line-height:1;margin-top:1px;opacity:0.95}
.cal-phase-strip{
  position:absolute;
  left:0;right:0;bottom:0;
  height:3.5px;
}
.cal-cell:not(.empty):active{transform:scale(0.92)}
.cal-cell.empty{visibility:hidden}
.cal-cell.today{font-weight:700}
.cal-cell.today{box-shadow:inset 0 0 0 2px var(--primary)}
.cal-cell.period{background:var(--period);color:white}
.cal-cell.tier-vlow{background:#D1FAE5;color:#065F46}
.cal-cell.tier-low{background:#ECFCCB;color:#3F6212}
.cal-cell.tier-med{background:#FEF08A;color:#854D0E}
.cal-cell.tier-high{background:#FFEDD5;color:#9A3412;border-color:#FDBA74}
.cal-cell.tier-vhigh{background:#FEE2E2;color:#991B1B;border-color:#F87171}
.cal-cell.is-pred{border-style:dashed;border-color:var(--predicted);opacity:0.85}
.cal-cell.unknown{background:var(--unknown-bg);color:var(--text-muted)}
.cal-cell.today.period .cal-day{color:white}

/* Legend */
.legend{
  display:grid;grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:16px;font-size:12px;
}
.legend-item{display:flex;align-items:center;gap:7px}
.legend-swatch{width:14px;height:14px;border-radius:5px;flex-shrink:0}
.legend-swatch.period{background:var(--period)}
.legend-swatch.tier-vlow{background:#D1FAE5}
.legend-swatch.tier-low{background:#ECFCCB}
.legend-swatch.tier-med{background:#FEF08A}
.legend-swatch.tier-high{background:#FFEDD5;border:1.5px solid #FDBA74}
.legend-swatch.tier-vhigh{background:#FEE2E2;border:1.5px solid #F87171}
.legend-note{
  font-size:11px;color:var(--text-muted);line-height:1.45;
  margin-top:12px;padding-top:12px;border-top:1px solid var(--border-soft);
}
.phase-legend-title{
  font-size:11px;font-weight:600;color:var(--text-muted);
  margin-top:12px;margin-bottom:8px;letter-spacing:0.02em;
}
.phase-legend{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;
}
.phase-legend-item{display:flex;align-items:center;gap:7px}
.phase-legend-strip{width:16px;height:4px;border-radius:2px;flex-shrink:0}

/* Calculation explanation (Statistik) */
.calc-step{
  display:flex;gap:11px;align-items:flex-start;
  font-size:13px;line-height:1.55;color:var(--text-muted);
  margin-top:12px;
}
.calc-num{
  width:24px;height:24px;border-radius:50%;
  background:var(--primary);color:white;
  font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-top:1px;
}
.calc-formula{
  background:var(--primary-faint);border:1px solid var(--border);
  border-radius:10px;padding:12px 14px;margin-top:14px;
  font-size:13px;color:var(--primary-dark);font-weight:600;
  text-align:center;line-height:1.5;
}
.calc-formula sub{font-size:10px}

/* Day detail modal */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(31,18,53,0.45);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  display:flex;align-items:flex-end;justify-content:center;
  z-index:100;
  animation:fadeIn 0.2s;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal{
  background:white;
  border-radius:24px 24px 0 0;
  width:100%;max-width:480px;
  padding:24px 22px calc(24px + env(safe-area-inset-bottom));
  animation:slideUp 0.25s cubic-bezier(0.16,1,0.3,1);
  max-height:90vh;overflow-y:auto;
}
.modal-handle{
  width:36px;height:4px;border-radius:2px;background:var(--border);
  margin:-10px auto 16px;
}
.modal-title{
  font-family:var(--font-display);
  font-size:22px;font-weight:600;color:var(--primary-dark);
  margin-bottom:6px;letter-spacing:-0.01em;
}
.modal-subtitle{font-size:13px;color:var(--text-muted);margin-bottom:16px}

.day-status-pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 12px;border-radius:999px;
  font-size:13px;font-weight:600;margin-bottom:8px;
}
.day-status-pill .swatch{width:10px;height:10px;border-radius:50%}
.day-status-pill.period{background:var(--period-bg);color:#991B1B}
.day-status-pill.period .swatch{background:var(--period)}
.day-status-pill.fertile{background:var(--fertile-bg);color:#9A3412}
.day-status-pill.fertile .swatch{background:var(--fertile)}
.day-status-pill.safe-pre{background:var(--caution-bg);color:#854D0E}
.day-status-pill.safe-pre .swatch{background:var(--caution)}
.day-status-pill.safe-post{background:var(--safe-bg);color:#065F46}
.day-status-pill.safe-post .swatch{background:var(--safe)}
.day-status-pill.predicted-period{background:var(--predicted-bg);color:#1E40AF}
.day-status-pill.predicted-period .swatch{background:var(--predicted)}
.day-status-pill.unknown{background:var(--unknown-bg);color:var(--text-muted)}
.day-status-pill.unknown .swatch{background:var(--unknown)}

/* Stats grid */
.stats-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:10px;
}
.stat-card{
  background:var(--card);border-radius:var(--radius);
  padding:14px;border:1px solid var(--border-soft);
}
.stat-label{font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px}
.stat-value{
  font-family:var(--font-display);
  font-size:28px;font-weight:600;color:var(--primary-dark);line-height:1;
}
.stat-unit{font-size:12px;color:var(--text-muted);margin-left:3px;font-family:var(--font-body)}
.stat-detail{font-size:12px;color:var(--text-muted);margin-top:4px}
.stat-card.wide{grid-column:span 2}
.stat-card.highlight{
  background:linear-gradient(135deg,#FFE4E6,#FBCFE8);
  border-color:var(--primary-light);
}
.stat-card.highlight .stat-value{color:var(--primary-dark)}

/* Cycle list */
.cycle-list{display:flex;flex-direction:column;gap:8px}
.cycle-item{
  background:white;border:1px solid var(--border-soft);
  border-radius:var(--radius);
  padding:12px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.cycle-info{flex:1;min-width:0}
.cycle-dates{font-size:14px;font-weight:600;color:var(--text)}
.cycle-meta{font-size:12px;color:var(--text-muted);margin-top:2px}
.cycle-actions{display:flex;gap:6px;flex-shrink:0}
.icon-btn{
  width:34px;height:34px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg-soft);color:var(--primary-dark);
}
.icon-btn.danger{background:var(--danger-bg);color:var(--danger)}
.icon-btn:active{transform:scale(0.92)}

/* Onboarding */
.onb-screen{padding:32px 24px 100px;min-height:100vh}
.onb-logo{
  width:84px;height:84px;border-radius:24px;
  background:linear-gradient(135deg,#FB7185,#DB2777);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 24px;
  box-shadow:0 12px 32px rgba(219,39,119,0.25);
}
.onb-title{
  font-family:var(--font-display);
  font-size:32px;font-weight:600;color:var(--primary-dark);
  text-align:center;margin-bottom:10px;letter-spacing:-0.01em;
}
.onb-subtitle{
  text-align:center;color:var(--text-muted);
  font-size:14.5px;line-height:1.55;margin-bottom:28px;
}
.onb-counter{
  text-align:center;font-size:13px;color:var(--text-muted);
  margin-bottom:14px;
}
.onb-counter strong{color:var(--primary-dark);font-weight:700}
.onb-progress{
  height:6px;background:var(--border-soft);border-radius:3px;
  overflow:hidden;margin-bottom:24px;
}
.onb-progress-fill{
  height:100%;background:linear-gradient(90deg,#FB7185,#DB2777);
  border-radius:3px;transition:width 0.3s;
}
.onb-method-info{
  background:var(--primary-faint);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px;
  font-size:13px;line-height:1.55;color:var(--text);
  margin-bottom:20px;
}
.onb-method-info strong{color:var(--primary-dark)}

/* Empty state */
.empty-state{
  text-align:center;padding:40px 20px;
  color:var(--text-muted);
}
.empty-icon{
  width:64px;height:64px;border-radius:50%;
  background:var(--bg-soft);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 14px;
  color:var(--primary);
}
.empty-title{font-family:var(--font-display);font-size:18px;color:var(--primary-dark);margin-bottom:6px;font-weight:600}
.empty-msg{font-size:13.5px;line-height:1.5}

/* Section header */
.section-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 4px;margin:18px 0 10px;
}
.section-title{
  font-family:var(--font-display);
  font-size:18px;font-weight:600;color:var(--primary-dark);
  letter-spacing:-0.01em;
}
.section-count{font-size:12px;color:var(--text-muted);font-weight:500}

/* Toast */
.toast{
  position:fixed;bottom:96px;left:50%;transform:translateX(-50%);
  background:var(--text);color:white;
  padding:11px 18px;border-radius:999px;
  font-size:13.5px;font-weight:500;
  box-shadow:0 8px 24px rgba(0,0,0,0.2);
  z-index:200;
  animation:toastIn 0.3s,toastOut 0.3s 2.4s forwards;
  max-width:88%;text-align:center;
}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,12px)}}

/* Confirm modal */
.confirm-modal{
  background:white;border-radius:20px;
  padding:22px;width:90%;max-width:360px;
  margin:auto;
  animation:popIn 0.2s cubic-bezier(0.16,1,0.3,1);
}
@keyframes popIn{from{opacity:0;transform:scale(0.92)}to{opacity:1;transform:scale(1)}}
.confirm-overlay{
  position:fixed;inset:0;background:rgba(31,18,53,0.5);
  display:flex;align-items:center;justify-content:center;
  z-index:150;padding:20px;
}
.confirm-title{font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--primary-dark);margin-bottom:8px}
.confirm-msg{font-size:14px;color:var(--text-muted);margin-bottom:18px;line-height:1.5}
.confirm-actions{display:flex;gap:8px}
.confirm-actions .btn{flex:1}

/* Today's verdict card */
.verdict{

<body>
<div id="app"></div>
<div id="modal-root"></div>
<script>
/* ============================================================
   SikluSayang — NFP Calendar (Ogino-Knaus Method)
   ============================================================ */

/* ---------- PWA Manifest (data URI — works in Samsung Internet & Chrome) ---------- */
(function(){
  const iconSvg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='112' fill='%23DB2777'/><g transform='translate(256 256)' fill='%23FBCFE8'><ellipse rx='52' ry='90' cy='-92'/><ellipse rx='52' ry='90' cy='-92' transform='rotate(72)'/><ellipse rx='52' ry='90' cy='-92' transform='rotate(144)'/><ellipse rx='52' ry='90' cy='-92' transform='rotate(216)'/><ellipse rx='52' ry='90' cy='-92' transform='rotate(288)'/><circle r='42' fill='%23FFFFFF'/></g></svg>`;
  const iconUrl = 'data:image/svg+xml;utf8,' + iconSvg;
  const manifest = {
    name: "SikluSayang — Kalender Kesuburan",
    short_name: "SikluSayang",
    description: "Pelacak siklus haid dengan metode Ogino-Knaus",
    start_url: "",
    scope: "",
    display: "standalone",
    orientation: "portrait",
    background_color: "#FDF2F8",
    theme_color: "#DB2777",
    lang: "id",
    icons: [
      {src: iconUrl, sizes: "192x192", type: "image/svg+xml", purpose: "any maskable"},
      {src: iconUrl, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable"}
    ]
  };
  // data: URI works in Samsung Internet; blob: does not
  try {
    document.getElementById('manifest-link').href =
      'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
  } catch(e) {}
})();

/* ---------- Install prompt (Chrome beforeinstallprompt) ---------- */
let _deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  _deferredInstallPrompt = e;
  // Show install banner if visible
  const banner = document.getElementById('install-banner');
  if(banner) banner.classList.remove('hidden');
});

/* ---------- Storage ---------- */
const STORAGE_KEY = 'siklusayang_v1';

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return {cycles: [], onboardingComplete: false};
    const d = JSON.parse(raw);
    return {
      cycles: Array.isArray(d.cycles) ? d.cycles : [],
      onboardingComplete: !!d.onboardingComplete
    };
  }catch(e){
    console.error('Load failed', e);
    return {cycles: [], onboardingComplete: false};
  }
}

function saveData(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      cycles: state.cycles,
      onboardingComplete: state.onboardingComplete
    }));
  }catch(e){
    console.error('Save failed', e);
    showToast('Gagal menyimpan data');
  }
}

/* ---------- State ---------- */
const initial = loadData();
const state = {
  cycles: initial.cycles,
  onboardingComplete: initial.onboardingComplete,
  currentView: 'kalender',
  calendarMonth: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
};

/* ---------- Date helpers ---------- */
function pad(n){return String(n).padStart(2,'0')}
function fmtDate(d){
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function parseDate(s){
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}
function daysBetween(a,b){
  const d1 = typeof a === 'string' ? parseDate(a) : a;
  const d2 = typeof b === 'string' ? parseDate(b) : b;
  const ms = d2 - d1;
  return Math.round(ms / 86400000);
}
function addDays(s, n){
  const d = parseDate(s);
  d.setDate(d.getDate() + n);
  return fmtDate(d);
}
function todayStr(){return fmtDate(new Date())}

const MONTHS_ID = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const WEEKDAYS_ID = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const DAYS_ID = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];

function fmtDateLong(s){
  const d = parseDate(s);
  return `${DAYS_ID[d.getDay()]}, ${d.getDate()} ${MONTHS_ID[d.getMonth()]} ${d.getFullYear()}`;
}
function fmtDateShort(s){
  const d = parseDate(s);
  return `${d.getDate()} ${MONTHS_ID[d.getMonth()].slice(0,3)} ${d.getFullYear()}`;
}

/* ---------- Cycle math (Ogino-Knaus) ---------- */
function sortedCycles(){
  return [...state.cycles].sort((a,b)=>a.startDate.localeCompare(b.startDate));
}

function getCycleLengths(){
  const sorted = sortedCycles();
  const lens = [];
  for(let i=1; i<sorted.length; i++){
    const len = daysBetween(sorted[i-1].startDate, sorted[i].startDate);
    if(len >= 15 && len <= 60) lens.push(len); // physiologic sanity
  }
  return lens;
}

function getRecentCycleLengths(){
  return getCycleLengths().slice(-12);
}

function getAvgPeriodLength(){
  const withEnd = state.cycles.filter(c => c.endDate);
  if(withEnd.length === 0) return 5;
  const lens = withEnd.map(c => daysBetween(c.startDate, c.endDate) + 1)
                      .filter(l => l >= 1 && l <= 14);
  if(lens.length === 0) return 5;
  return Math.round(lens.reduce((a,b)=>a+b,0) / lens.length);
}

function getStats(){
  const lens = getRecentCycleLengths();
  if(lens.length === 0) return null;
  const shortest = Math.min(...lens);
  const longest = Math.max(...lens);
  const avg = lens.reduce((a,b)=>a+b,0) / lens.length;
  const variation = longest - shortest;

  // Classic Ogino-Knaus (for reference / education):
  //   first fertile = shortest − 18, last fertile = longest − 11
  const classicStart = shortest - 18;
  const classicEnd = longest - 11;

  // CONSERVATIVE window used for contraceptive decisions.
  // Biological derivation (for avoiding pregnancy):
  //   earliest ovulation = shortest − 16 (luteal phase up to 16 days)
  //   sperm survive up to 5 days  → first fertile = (shortest − 16) − 5 = shortest − 21
  //   latest ovulation   = longest − 11; egg viable ~1 day → last fertile = longest − 10
  // The classic −18 assumes only ~2 days of sperm survival, which under-protects.
  const fertileStart = shortest - 21;
  const fertileEnd = longest - 10;
  const fertileWidth = Math.max(0, fertileEnd - fertileStart + 1);

  return {
    shortest, longest,
    avg: avg,
    avgRound: Math.round(avg),
    variation,
    fertileStart, fertileEnd, fertileWidth,
    classicStart, classicEnd,
    lutealEstimate: 14,
    cyclesUsed: lens.length,
    totalCycles: state.cycles.length,
    avgPeriodLen: getAvgPeriodLength()
  };
}

/* ---------- Conception probability model ----------
   Per-act conception probabilities relative to ovulation day are from
   Wilcox, Weinberg & Baird (NEJM 1995): the 6-day fertile window ending on
   ovulation, ranging 0.10 (−5d) to 0.33 (ovulation day).
   Because calendar data cannot pinpoint ovulation, we marginalise over an
   ovulation-day distribution derived from the user's own cycle-length
   variability (+ luteal-phase variability). For irregular cycles this spreads
   risk across many days — an honest reflection of the uncertainty. */
const WILCOX = {'-5':0.10,'-4':0.16,'-3':0.14,'-2':0.27,'-1':0.31,'0':0.33,'1':0.02};
function wilcox(offset){return WILCOX[String(offset)] || 0;}
function normPdf(x,m,s){return Math.exp(-0.5*Math.pow((x-m)/s,2))/(s*Math.sqrt(2*Math.PI));}

function getOvulationDistribution(){
  const lens = getRecentCycleLengths();
  if(lens.length < 3) return null; // need ≥3 cycle lengths for a meaningful spread
  const mean = lens.reduce((a,b)=>a+b,0)/lens.length;
  // sample SD (n−1) — slightly wider/conservative for small samples
  const variance = lens.reduce((a,b)=>a+Math.pow(b-mean,2),0)/(lens.length-1);
  let sdCyc = Math.sqrt(variance);
  if(sdCyc < 1) sdCyc = 1; // floor: inherent biological + logging uncertainty
  const lutealMean = 14, lutealSd = 1.5;
  const ovMean = mean - lutealMean;
  const ovSd = Math.sqrt(sdCyc*sdCyc + lutealSd*lutealSd);
  return {ovMean, ovSd};
}

/* Probability (0..1) of conception from a single unprotected act on a given cycle day */
function getConceptionProb(dayInCycle){
  const dist = getOvulationDistribution();
  if(!dist) return null;
  const lo = Math.max(1, Math.round(dist.ovMean - 4*dist.ovSd));
  const hi = Math.round(dist.ovMean + 4*dist.ovSd);
  let norm = 0; const ks = [];
  for(let k=lo; k<=hi; k++){
    const pk = normPdf(k, dist.ovMean, dist.ovSd);
    ks.push([k,pk]); norm += pk;
  }
  if(norm === 0) return 0;
  let p = 0;
  for(const [k,pk] of ks) p += (pk/norm) * wilcox(dayInCycle - k);
  return p;
}

/* Risk tier from a probability (0..1) */
function getProbTier(prob){
  const pct = prob * 100;
  if(pct < 1)  return {key:'vlow',  label:'Sangat rendah', color:'#059669', bg:'#D1FAE5', text:'#065F46'};
  if(pct < 5)  return {key:'low',   label:'Rendah',        color:'#65A30D', bg:'#ECFCCB', text:'#3F6212'};
  if(pct < 10) return {key:'med',   label:'Sedang',        color:'#CA8A04', bg:'#FEF08A', text:'#854D0E'};
  if(pct < 20) return {key:'high',  label:'Tinggi',        color:'#EA580C', bg:'#FFEDD5', text:'#9A3412'};
  return              {key:'vhigh', label:'Sangat tinggi', color:'#DC2626', bg:'#FEE2E2', text:'#991B1B'};
}

/* Round a probability to a display string, avoiding false precision */
function fmtProb(prob){
  const pct = prob * 100;
  if(pct < 0.5) return '<1%';
  return Math.round(pct) + '%';
}

function getReliability(){
  const stats = getStats();
  if(!stats || stats.cyclesUsed < 6) return null;
  const v = stats.variation;
  if(v <= 6) return {
    level: 'green',
    title: 'Siklus Teratur',
    msg: 'Siklus Anda cukup teratur. Metode kalender cukup dapat diandalkan.',
    variation: v,
    barPct: Math.max(20, 100 - v*8)
  };
  if(v <= 9) return {
    level: 'yellow',
    title: 'Siklus Kurang Teratur',
    msg: 'Siklus Anda memiliki variasi sedang. Jendela subur melebar — waspadai hari tidak aman.',
    variation: v,
    barPct: 60
  };
  return {
    level: 'red',
    title: 'Siklus Tidak Teratur',
    msg: 'Siklus Anda sangat tidak teratur. Metode kalender tidak dianjurkan sebagai satu-satunya kontrasepsi.',
    variation: v,
    barPct: 30
  };
}

/* ---------- Menstrual phases ---------- */
const PHASES = {
  menstruasi: {
    name: 'Menstruasi',
    color: '#E11D48', bg: '#FFE4E6', text: '#9F1239',
    desc: 'Dinding rahim luruh. Estrogen dan progesteron berada di titik terendah.',
    tip: 'Istirahat cukup, jaga asupan zat besi dan cairan. Olahraga ringan dapat meredakan kram.'
  },
  folikuler: {
    name: 'Folikuler',
    color: '#059669', bg: '#D1FAE5', text: '#065F46',
    desc: 'Folikel berkembang dan estrogen meningkat. Energi serta suasana hati cenderung membaik.',
    tip: 'Fase terbaik untuk aktivitas fisik intens dan tugas yang menuntut fokus tinggi.'
  },
  ovulasi: {
    name: 'Ovulasi',
    color: '#EA580C', bg: '#FFEDD5', text: '#9A3412',
    desc: 'Sel telur dilepaskan. Estrogen di puncak dan ini adalah masa paling subur.',
    tip: 'Jendela subur. Gunakan pengaman bila menghindari kehamilan, atau rencanakan bila menginginkan.'
  },
  luteal: {
    name: 'Luteal',
    color: '#7C3AED', bg: '#EDE9FE', text: '#5B21B6',
    desc: 'Korpus luteum memproduksi progesteron. Gejala PMS dapat muncul menjelang akhir fase.',
    tip: 'Kurangi kafein dan garam menjelang haid. Tidur cukup membantu mengelola gejala PMS.'
  }
};

/* Phase segment layout for the current-cycle bar */
function getPhaseSegments(){
  const stats = getStats();
  if(!stats) return null;
  const avgCycle = stats.avgRound;
  const periodLen = Math.min(stats.avgPeriodLen, avgCycle - 6);
  // Luteal phase relatively constant ~14d → ovulation ≈ cycle − 14
  let ovulationDay = avgCycle - 14;
  if(ovulationDay < periodLen + 2) ovulationDay = periodLen + 2;
  const ovStart = ovulationDay - 1;
  const ovEnd = ovulationDay + 1;
  const segments = [
    {key:'menstruasi', start:1, end:periodLen},
    {key:'folikuler', start:periodLen+1, end:ovStart-1},
    {key:'ovulasi', start:ovStart, end:ovEnd},
    {key:'luteal', start:ovEnd+1, end:avgCycle}
  ].filter(s => s.end >= s.start);
  return {avgCycle, periodLen, ovulationDay, ovStart, ovEnd, segments};
}

/* Determine which phase a given date falls in */
function getCyclePhase(dateStr){
  const sorted = sortedCycles();
  if(sorted.length === 0) return null;

  // Anchor: most recent logged cycle start ≤ dateStr
  let anchorIdx = -1;
  for(let i = sorted.length - 1; i >= 0; i--){
    if(sorted[i].startDate <= dateStr){anchorIdx = i; break}
  }
  if(anchorIdx === -1) return null;

  const cycle = sorted[anchorIdx];
  const stats = getStats();
  const dayInCycle = daysBetween(cycle.startDate, dateStr) + 1;

  // Actual period length if known, else average
  let periodLen;
  if(cycle.endDate){
    periodLen = daysBetween(cycle.startDate, cycle.endDate) + 1;
  } else {
    periodLen = stats ? stats.avgPeriodLen : 5;
  }

  // 1. Menstruation — always reliable (from actual data)
  if(dayInCycle <= periodLen){
    return {key:'menstruasi', dayInCycle, estimated:false, ...PHASES.menstruasi};
  }

  // Without ≥2 cycles we cannot estimate ovulation/luteal
  if(!stats){
    return {key:'folikuler', dayInCycle, estimated:true, lowData:true, ...PHASES.folikuler};
  }

  const avgCycle = stats.avgRound;
  let ovulationDay = avgCycle - 14;
  if(ovulationDay < periodLen + 2) ovulationDay = periodLen + 2;
  const ovStart = ovulationDay - 1;
  const ovEnd = ovulationDay + 1;

  if(dayInCycle < ovStart){
    return {key:'folikuler', dayInCycle, estimated:true, ...PHASES.folikuler};
  }
  if(dayInCycle <= ovEnd){
    return {key:'ovulasi', dayInCycle, estimated:true, ...PHASES.ovulasi};
  }
  return {key:'luteal', dayInCycle, estimated:true, ...PHASES.luteal};
}

/* Determine status of a single date string */
function getDayStatus(dateStr){
  const sorted = sortedCycles();

  // 1. Actual menstruation day?
  for(const c of sorted){
    const end = c.endDate || c.startDate;
    if(dateStr >= c.startDate && dateStr <= end){
      return {type: 'period', label: 'Hari haid'};
    }
  }

  if(sorted.length === 0){
    return {type: 'unknown', label: 'Belum ada data'};
  }

  // Date before earliest log → unknown
  if(dateStr < sorted[0].startDate){
    return {type: 'unknown', label: 'Sebelum data tercatat'};
  }

  const stats = getStats();
  if(!stats){
    return {type: 'unknown', label: 'Perlu minimal 2 siklus'};
  }

  // Find anchor: most recent logged cycle start ≤ dateStr
  let anchorIdx = -1;
  for(let i = sorted.length - 1; i >= 0; i--){
    if(sorted[i].startDate <= dateStr){anchorIdx = i; break}
  }
  if(anchorIdx === -1){
    return {type: 'unknown', label: 'Sebelum data tercatat'};
  }

  let cycleStart = sorted[anchorIdx].startDate;
  const lastLogged = sorted[sorted.length - 1].startDate;
  let isPredicted = false;

  // If we're past the last logged cycle, project forward in avgRound steps
  if(anchorIdx === sorted.length - 1 && dateStr > lastLogged){
    const avg = stats.avgRound;
    while(true){
      const next = addDays(cycleStart, avg);
      if(next > dateStr) break;
      cycleStart = next;
      isPredicted = true;
    }
    // If date falls within predicted period window
    if(isPredicted){
      const predEnd = addDays(cycleStart, stats.avgPeriodLen - 1);
      if(dateStr >= cycleStart && dateStr <= predEnd){
        return {type: 'predicted-period', label: 'Prediksi haid berikutnya'};
      }
    }
  }

  const dayInCycle = daysBetween(cycleStart, dateStr) + 1;

  // Conception probability for this cycle day (marginalised over ovulation uncertainty)
  const prob = getConceptionProb(dayInCycle);
  if(prob === null){
    // Not enough cycles for a probability estimate
    return {type:'unknown', label:'Perlu ≥3 siklus untuk estimasi', dayInCycle};
  }
  const tier = getProbTier(prob);
  return {
    type: 'prob',
    prob,
    tier,
    dayInCycle,
    isPredicted,
    label: (isPredicted ? 'Prediksi · ' : '') + 'Kemungkinan hamil ' + fmtProb(prob)
  };
}

/* ---------- Cycle CRUD ---------- */
function addCycle(startDate, endDate){
  if(!startDate) throw new Error('Tanggal mulai wajib diisi');
  if(endDate && endDate < startDate) throw new Error('Tanggal selesai tidak boleh sebelum tanggal mulai');
  // Check for overlap
  for(const c of state.cycles){
    const cEnd = c.endDate || c.startDate;
    const newEnd = endDate || startDate;
    if(!(newEnd < c.startDate || startDate > cEnd)){
      throw new Error('Periode bertumpang tindih dengan siklus yang sudah ada');
    }
  }
  state.cycles.push({
    id: 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    startDate,
    endDate: endDate || null
  });
  saveData();
}

function updateCycle(id, startDate, endDate){
  if(!startDate) throw new Error('Tanggal mulai wajib diisi');
  if(endDate && endDate < startDate) throw new Error('Tanggal selesai tidak boleh sebelum tanggal mulai');
  for(const c of state.cycles){
    if(c.id === id) continue;
    const cEnd = c.endDate || c.startDate;
    const newEnd = endDate || startDate;
    if(!(newEnd < c.startDate || startDate > cEnd)){
      throw new Error('Periode bertumpang tindih dengan siklus yang sudah ada');
    }
  }
  const idx = state.cycles.findIndex(c => c.id === id);
  if(idx === -1) return;
  state.cycles[idx] = {id, startDate, endDate: endDate || null};
  saveData();
}

function deleteCycle(id){
  state.cycles = state.cycles.filter(c => c.id !== id);
  saveData();
}

/* ---------- View: Calendar ---------- */
function renderCalendarView(){
  const stats = getStats();
  const reliability = getReliability();
  const warning = (!stats || stats.cyclesUsed < 6);

  const m = state.calendarMonth;
  const year = m.getFullYear();
  const monthIdx = m.getMonth();
  const monthName = MONTHS_ID[monthIdx];

  const firstDay = new Date(year, monthIdx, 1);
  const lastDay = new Date(year, monthIdx + 1, 0);
  const startWeekday = firstDay.getDay();
  const daysInMonth = lastDay.getDate();
  const today = todayStr();

  let cells = '';
  for(let i = 0; i < startWeekday; i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d = 1; d <= daysInMonth; d++){
    const date = fmtDate(new Date(year, monthIdx, d));
    const status = getDayStatus(date);
    const phase = getCyclePhase(date);
    const isToday = date === today;
    let cls = status.type;
    let pctLabel = '';
    if(status.type === 'prob'){
      cls = 'tier-' + status.tier.key + (status.isPredicted ? ' is-pred' : '');
      pctLabel = `<span class="cal-pct">${fmtProb(status.prob)}</span>`;
    }
    // Phase strip at the bottom of the cell (second dimension: cycle phase)
    const strip = phase
      ? `<span class="cal-phase-strip" style="background:${phase.color}"></span>`
      : '';
    cells += `<button class="cal-cell ${cls} ${isToday ? 'today' : ''}" data-date="${date}"><span class="cal-day">${d}</span>${pctLabel}${strip}</button>`;
  }

  const weekdayHeads = WEEKDAYS_ID.map((w,i) =>
    `<div class="cal-weekday ${(i===0||i===6)?'weekend':''}">${w}</div>`
  ).join('');

  return `
    <div class="card-section">
      ${renderTodayVerdict(today)}
      ${renderPhaseHero(today)}
      ${warning ? renderInsufficientWarning() : (reliability ? renderReliability(reliability) : '')}

      <div class="cal-nav">
        <button class="cal-nav-btn" data-cal-nav="prev" aria-label="Bulan sebelumnya">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button class="cal-month-title" data-cal-nav="today">${monthName} ${year}</button>
        <button class="cal-nav-btn" data-cal-nav="next" aria-label="Bulan berikutnya">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>

      <div class="card">
        <div class="cal-grid">${weekdayHeads}</div>
        <div class="cal-grid" style="margin-top:4px">${cells}</div>
        <div class="legend">
          <div class="legend-item"><span class="legend-swatch period"></span>Hari haid</div>
          <div class="legend-item"><span class="legend-swatch tier-vlow"></span>&lt;1% — sangat rendah</div>
          <div class="legend-item"><span class="legend-swatch tier-low"></span>1–4% — rendah</div>
          <div class="legend-item"><span class="legend-swatch tier-med"></span>5–9% — sedang</div>
          <div class="legend-item"><span class="legend-swatch tier-high"></span>10–19% — tinggi</div>
          <div class="legend-item"><span class="legend-swatch tier-vhigh"></span>≥20% — sangat tinggi</div>
        </div>
        <div class="legend-note">Angka = perkiraan kemungkinan hamil dari satu kali hubungan tanpa kondom pada hari itu. Garis putus-putus = bulan prediksi.</div>
        <div class="phase-legend-title">Strip bawah = fase siklus</div>
        <div class="phase-legend">
          <div class="phase-legend-item"><span class="phase-legend-strip" style="background:#E11D48"></span>Menstruasi</div>
          <div class="phase-legend-item"><span class="phase-legend-strip" style="background:#059669"></span>Folikuler</div>
          <div class="phase-legend-item"><span class="phase-legend-strip" style="background:#EA580C"></span>Ovulasi</div>
          <div class="phase-legend-item"><span class="phase-legend-strip" style="background:#7C3AED"></span>Luteal</div>
        </div>
      </div>
    </div>
  `;
}

function renderInsufficientWarning(){
  return `
    <div class="banner banner-warning mb-2">
      <svg class="banner-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>

function renderReliability(r){
  return `
    <div class="reliability rel-${r.level}">
      <div class="reliability-row">
        <div class="reliability-status">${r.title}</div>
        <div class="reliability-variation">Variasi: ${r.variation} hari</div>
      </div>

      <div class="reliability-msg">${r.msg}</div>

function renderPhaseHero(dateStr){
  const phase = getCyclePhase(dateStr);
  if(!phase) return '';

  // Cross-reference conception probability so the phase card never contradicts the calendar
  const dayStatus = getDayStatus(dateStr);
  let fertLine = '';
  if(dayStatus.type === 'prob'){
    fertLine = `
      <div class="phase-fert-line">
        <span class="phase-fert-dot" style="background:${dayStatus.tier.color}"></span>
        <span>Kemungkinan hamil hari ini: <strong style="color:${dayStatus.tier.color}">${fmtProb(dayStatus.prob)} (${dayStatus.tier.label})</strong></span>
      </div>`;
  } else if(dayStatus.type === 'period'){
    fertLine = `
      <div class="phase-fert-line">
        <span class="phase-fert-dot" style="background:var(--period)"></span>
        <span>Hari haid aktual</span>
      </div>`;
  }

  const segData = getPhaseSegments();
  let barHtml = '';
  let labelsHtml = '';

  if(segData && !phase.lowData){
    const total = segData.avgCycle;
    barHtml = segData.segments.map(s => {
      const w = ((s.end - s.start + 1) / total) * 100;
      const p = PHASES[s.key];
      return `<div class="phase-seg" style="width:${w}%;background:${p.color}" title="${p.name}"></div>`;
    }).join('');
    const pos = Math.max(0, Math.min(100, ((phase.dayInCycle - 0.5) / total) * 100));
    barHtml += `<div class="phase-marker" style="left:${pos}%"></div>`;
    labelsHtml = `
      <div class="phase-bar-labels">
        <span style="color:${PHASES.menstruasi.color}">Haid</span>
        <span style="color:${PHASES.folikuler.color}">Folikuler</span>
        <span style="color:${PHASES.ovulasi.color}">Ovulasi</span>
        <span style="color:${PHASES.luteal.color}">Luteal</span>
      </div>`;
  }

  const estNote = phase.estimated ? `
    <div class="phase-est-note">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      <span>Fase & ovulasi adalah estimasi dari rata-rata siklus. Untuk keputusan kontrasepsi, ikuti status kesuburan di atas, bukan nama fase.</span>
    </div>` : '';

  const lowDataNote = phase.lowData ? `
    <div class="phase-est-note">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      <span>Perlu minimal 2 siklus untuk memetakan fase ovulasi & luteal.</span>
    </div>` : '';

  return `
    <div class="phase-hero" style="--ph:${phase.color};--ph-bg:${phase.bg};--ph-text:${phase.text}">
      <div class="phase-hero-top">
        <div>
          <div class="phase-label">Fase saat ini</div>
          <div class="phase-name">${phase.name}</div>
        </div>
        <div class="phase-day-badge">Hari ke-<strong>${phase.dayInCycle}</strong></div>
      </div>
      ${fertLine}
      ${barHtml ? `<div class="phase-bar">${barHtml}</div>${labelsHtml}` : ''}
      <div class="phase-desc">${phase.desc}</div>
      <div class="phase-tip">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:2px"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V18h6v-1.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/></svg>
        <span>${phase.tip}</span>
      </div>
      ${estNote}${lowDataNote}
    </div>
  `;
}

function renderTodayVerdict(dateStr){
  const status = getDayStatus(dateStr);
  const rel = getReliability();

  if(status.type === 'period'){
    return `
      <div class="verdict v-period">
        <div class="verdict-label">Kemungkinan hamil · hari ini</div>
        <div class="verdict-head">Sedang haid</div>
        <div class="verdict-sub">Hari haid aktual. Kesuburan pada hari haid umumnya rendah, namun pada siklus pendek bisa tidak nol.</div>
      </div>`;
  }
  if(status.type === 'unknown' || status.type === 'predicted-period'){
    const sub = status.type === 'predicted-period'
      ? 'Perkiraan hari haid berikutnya.'
      : 'Data belum cukup untuk mengestimasi kemungkinan hari ini.';
    return `
      <div class="verdict v-unknown">
        <div class="verdict-label">Kemungkinan hamil · hari ini</div>
        <div class="verdict-head">Belum dapat dihitung</div>
        <div class="verdict-sub">${sub}</div>
      </div>`;
  }

  // Probability day
  const t = status.tier;
  const vClassMap = {vlow:'v-safe', low:'v-safe', med:'v-caution', high:'v-danger', vhigh:'v-danger'};
  const vClass = vClassMap[t.key] || 'v-caution';

  let escalation = '';
  if(rel && rel.level === 'red'){
    escalation = `<div class="verdict-escalation">Siklus Anda sangat tidak teratur (variasi ${rel.variation} hari), sehingga angka ini memiliki ketidakpastian besar. Untuk mencegah kehamilan dengan andal, gunakan kondom pada semua hari berisiko.</div>`;
  }

  return `
    <div class="verdict ${vClass}">
      <div class="verdict-label">Kemungkinan hamil · satu kali tanpa kondom · hari ini</div>
      <div class="verdict-head"><span class="verdict-pct">${fmtProb(status.prob)}</span> <span class="verdict-tier">${t.label}</span></div>
      <div class="verdict-sub">Hari ke-${status.dayInCycle} siklus. Angka ini perkiraan dari pola siklus Anda — bukan kepastian.</div>
      ${escalation}
    </div>
  `;
}

function renderCycleItem(c, prev){
  // prev is the older cycle (sorted desc by startDate)
  let cycleLength = null;
  if(prev){
    cycleLength = daysBetween(prev.startDate, c.startDate);
  }
  const periodLen = c.endDate ? daysBetween(c.startDate, c.endDate) + 1 : null;
  const meta = [];
  if(cycleLength != null && cycleLength > 0) meta.push(`Siklus ${cycleLength} hari`);
  if(periodLen) meta.push(`Haid ${periodLen} hari`);
  else meta.push(`Tanpa tanggal selesai`);

  const dateLine = c.endDate
    ? `${fmtDateShort(c.startDate)} → ${fmtDateShort(c.endDate)}`
    : `${fmtDateShort(c.startDate)}`;

  return `
    <div class="cycle-item">
      <div class="cycle-info">
        <div class="cycle-dates">${dateLine}</div>
        <div class="cycle-meta">${meta.join(' · ')}</div>
      </div>
      <div class="cycle-actions">
        <button class="icon-btn" data-edit-cycle="${c.id}" aria-label="Edit">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        <button class="icon-btn danger" data-del-cycle="${c.id}" aria-label="Hapus">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        </button>
      </div>
    </div>
  `;
}

        <div class="stat-card">
          <div class="stat-label">Rata-rata siklus</div>
          <div class="stat-value">${stats.avg.toFixed(1)}<span class="stat-unit">hari</span></div>
          <div class="stat-detail">dari ${stats.cyclesUsed} siklus</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total tercatat</div>
          <div class="stat-value">${stats.totalCycles}<span class="stat-unit">siklus</span></div>
          <div class="stat-detail">sepanjang waktu</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Siklus terpendek</div>
          <div class="stat-value">${stats.shortest}<span class="stat-unit">hari</span></div>
          <div class="stat-detail">12 siklus terakhir</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Siklus terpanjang</div>
          <div class="stat-value">${stats.longest}<span class="stat-unit">hari</span></div>
          <div class="stat-detail">12 siklus terakhir</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Variasi siklus</div>
          <div class="stat-value">${stats.variation}<span class="stat-unit">hari</span></div>
          <div class="stat-detail">terpanjang − terpendek</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Estimasi luteal</div>
          <div class="stat-value">~${stats.lutealEstimate}<span class="stat-unit">hari</span></div>
          <div class="stat-detail">perkiraan standar</div>
        </div>
      </div>

      <div class="card mt-2">
        <div class="card-title" style="font-size:16px">Bagaimana persentase kehamilan dihitung</div>
        ${(() => {
          const dist = getOvulationDistribution();
          if(!dist){
            return `<div style="font-size:13px;line-height:1.6;color:var(--text-muted)">Perlu minimal 3 siklus tercatat agar persentase dapat dihitung.</div>`;
          }
          let peakProb = 0, peakDay = 0;
          for(let d = 1; d <= stats.avgRound + 12; d++){
            const p = getConceptionProb(d);
            if(p > peakProb){ peakProb = p; peakDay = d; }
          }
          return `
          <div style="font-size:13px;line-height:1.6;color:var(--text-muted)">
            Tiap hari menampilkan perkiraan peluang hamil dari <strong>satu kali</strong> hubungan tanpa kondom. Dihitung dalam 3 langkah:
          </div>
          <div class="calc-step">
            <div class="calc-num">1</div>
            <div><strong style="color:var(--primary-dark)">Data dasar (Wilcox, NEJM 1995).</strong> Peluang konsepsi per hubungan menurut jarak ke hari ovulasi: dari ~10% (5 hari sebelum) hingga ~33% (hari ovulasi). Di luar jendela 6 hari ini ≈ 0%.</div>
          </div>
          <div class="calc-step">
            <div class="calc-num">2</div>
            <div><strong style="color:var(--primary-dark)">Sebaran ovulasi Anda.</strong> Kalender tidak bisa memastikan hari ovulasi, jadi app memperkirakan sebarannya dari pola siklus Anda: ovulasi ≈ panjang siklus − 14. Untuk Anda, ovulasi diperkirakan sekitar <strong>hari ke-${Math.round(dist.ovMean)} ± ${dist.ovSd.toFixed(1)} hari</strong>.</div>
          </div>
          <div class="calc-step">
            <div class="calc-num">3</div>
            <div><strong style="color:var(--primary-dark)">Penggabungan.</strong> Untuk tiap hari, peluang Wilcox dijumlahkan terhadap semua kemungkinan hari ovulasi, ditimbang probabilitasnya.</div>
          </div>
          <div class="calc-formula">P(hamil | hari‑d) = Σ<sub>k</sub> P(ovulasi = k) × Wilcox(d − k)</div>
          <div style="font-size:13px;line-height:1.6;color:var(--text-muted);margin-top:12px">
            <strong style="color:var(--primary-dark)">Akibat dari variasi siklus Anda:</strong><br>
            Karena sebaran ovulasi Anda lebar (±${dist.ovSd.toFixed(1)} hari), risiko "menyebar" ke banyak hari. Puncak tertinggi hanya sekitar <strong style="color:var(--fertile-dark)">${fmtProb(peakProb)} di hari ke-${peakDay}</strong>. Pada siklus yang sangat teratur, puncak bisa setajam ~25–33% dengan hari aman yang jelas — sebaran lebar justru menandakan tidak ada hari yang benar-benar bebas risiko.
          </div>
          <div class="banner banner-info" style="margin-top:12px;font-size:12px">
            <div>Catatan: angka ini untuk <strong>satu kali</strong> hubungan. Risiko kumulatif dari beberapa kali hubungan jauh lebih tinggi. Angka Wilcox berasal dari pasangan subur sehat, sehingga cenderung perkiraan batas atas.</div>
          </div>`;
        })()}
      </div>

      <div class="card mt-2">
        <div class="card-title" style="font-size:16px">Apakah app menyesuaikan otomatis?</div>
        <div style="font-size:13px;line-height:1.6;color:var(--text-muted)">
          <strong style="color:var(--safe)">Ya, sepenuhnya otomatis.</strong> Setiap kali Anda mencatat haid baru — bahkan bila melenceng dari prediksi — app langsung:
          <br>• Menggeser kalender ke tanggal haid aktual (prediksi diganti data nyata)
          <br>• Menghitung ulang rata-rata, variasi, dan sebaran ovulasi
          <br>• Memperbarui persentase kehamilan dan fase tiap hari
          <br><br>
          <span style="font-size:12px">Catatan jujur: persentase untuk siklus berjalan adalah <em>prediksi</em> dari riwayat Anda — app belum tahu kapan ovulasi siklus ini benar-benar terjadi sampai haid berikutnya tercatat. Semakin tidak teratur catatan, semakin lebar sebaran dan semakin besar ketidakpastiannya.</span>
        </div>
      </div>

      <div class="card mt-2">
        <div class="card-title" style="font-size:16px">Bagaimana jendela subur dihitung</div>
        <div style="font-size:13px;line-height:1.6;color:var(--text-muted)">
          App ini memakai batas <strong style="color:var(--primary-dark)">konservatif</strong> agar lebih aman untuk mencegah kehamilan:<br><br>
          <strong style="color:var(--fertile-dark)">Awal subur — hari ${stats.fertileStart}</strong> = terpendek (${stats.shortest}) − 21<br>
          <span style="font-size:12px">Ovulasi paling awal (terpendek − 16) dikurangi daya tahan sperma hingga 5 hari.</span><br><br>
          <strong style="color:var(--fertile-dark)">Akhir subur — hari ${stats.fertileEnd}</strong> = terpanjang (${stats.longest}) − 10<br>
          <span style="font-size:12px">Ovulasi paling lambat ditambah masa hidup sel telur ~1 hari.</span><br><br>
          <span style="font-size:12px">Rumus Ogino-Knaus klasik (−18 / −11) memberi hari ${stats.classicStart}–${stats.classicEnd}, namun mengasumsikan sperma hanya bertahan ~2 hari. Karena sperma nyatanya dapat bertahan hingga 5 hari, app sengaja melebarkan jendela subur agar tidak meremehkan risiko.</span>
        </div>
      </div>

      <div class="card mt-2" style="border-color:#FCA5A5;background:#FEF2F2">
        <div class="card-title" style="font-size:16px;color:#991B1B">Keterbatasan untuk kontrasepsi</div>
        <div style="font-size:13px;line-height:1.6;color:#7F1D1D">
          Metode kalender memiliki <strong>tingkat kegagalan ~24% per tahun pada penggunaan tipikal</strong> (hingga ~1 dari 4 wanita hamil dalam setahun). Bahkan pada penggunaan sempurna, kegagalan bisa mencapai ~5–9%.<br><br>
          Keandalan menurun drastis pada siklus tidak teratur. Untuk pencegahan kehamilan yang andal, kombinasikan dengan <strong>kondom pada seluruh hari subur</strong>, atau pertimbangkan metode lain. App ini adalah alat bantu edukasi, bukan pengganti konsultasi medis.
        </div>
      </div>
    </div>
  `;
}

/* ---------- Event binding ---------- */
function bindGlobalEvents(){
  // Bottom nav
  document.querySelectorAll('[data-nav]').forEach(b => {
    b.addEventListener('click', () => {
      state.currentView = b.dataset.nav;
      render();
    });
  });

  // Calendar nav
  document.querySelectorAll('[data-cal-nav]').forEach(b => {
    b.addEventListener('click', () => {
      const dir = b.dataset.calNav;
      if(dir === 'prev'){
        state.calendarMonth = new Date(state.calendarMonth.getFullYear(), state.calendarMonth.getMonth() - 1, 1);
      } else if(dir === 'next'){
        state.calendarMonth = new Date(state.calendarMonth.getFullYear(), state.calendarMonth.getMonth() + 1, 1);
      } else if(dir === 'today'){
        const t = new Date();
        state.calendarMonth = new Date(t.getFullYear(), t.getMonth(), 1);
      }
      render();
    });
  });

  // Calendar day tap
  document.querySelectorAll('[data-date]').forEach(b => {
    b.addEventListener('click', () => showDayModal(b.dataset.date));
  });

  // Catat: add cycle
  const addBtn = document.getElementById('add-cycle-btn');
  if(addBtn){
    addBtn.addEventListener('click', handleAddCycle);
  }

  // Catat: edit/delete
  document.querySelectorAll('[data-edit-cycle]').forEach(b => {
    b.addEventListener('click', () => showEditCycleModal(b.dataset.editCycle));
  });
  document.querySelectorAll('[data-del-cycle]').forEach(b => {
    b.addEventListener('click', () => confirmDeleteCycle(b.dataset.delCycle));
  });

  // Data view
  const ej = document.getElementById('export-json');
  if(ej) ej.addEventListener('click', exportJSON);
  const ec = document.getElementById('export-csv');
  if(ec) ec.addEventListener('click', exportCSV);
  const ij = document.getElementById('import-json');
  const ifile = document.getElementById('import-file');
  if(ij && ifile){
    ij.addEventListener('click', () => ifile.click());
    ifile.addEventListener('change', handleImportFile);
  }
  const reset = document.getElementById('reset-all');
  if(reset) reset.addEventListener('click', confirmResetAll);

  // PWA install button (Chrome beforeinstallprompt)
  const pwaBtn = document.getElementById('pwa-install-btn');
  if(pwaBtn && _deferredInstallPrompt){
    pwaBtn.addEventListener('click', async () => {
      _deferredInstallPrompt.prompt();
      const {outcome} = await _deferredInstallPrompt.userChoice;
      if(outcome === 'accepted'){
        _deferredInstallPrompt = null;
        showToast('SikluSayang berhasil dipasang ✨');
        render();
      }
    });
  }
}

function bindOnboarding(){
  const addBtn = document.getElementById('onb-add-btn');
  if(addBtn) addBtn.addEventListener('click', handleOnbAddCycle);

  document.querySelectorAll('[data-edit-cycle]').forEach(b => {
    b.addEventListener('click', () => showEditCycleModal(b.dataset.editCycle));
  });
  document.querySelectorAll('[data-del-cycle]').forEach(b => {
    b.addEventListener('click', () => confirmDeleteCycle(b.dataset.delCycle));
  });

  const finish = document.getElementById('onb-finish-btn');
  if(finish) finish.addEventListener('click', () => {
    state.onboardingComplete = true;
    saveData();
    render();
    showToast('Selamat datang di SikluSayang ✨');
  });
}

/* ---------- Handlers ---------- */
function handleAddCycle(){
  const start = document.getElementById('add-start').value;
  const end = document.getElementById('add-end').value;
  const errEl = document.getElementById('add-error');
  errEl.classList.add('hidden');
  try{
    addCycle(start, end);
    showToast('Siklus tersimpan');
    render();
  }catch(e){
    errEl.textContent = e.message;
    errEl.classList.remove('hidden');
  }
}

function handleOnbAddCycle(){
  const start = document.getElementById('onb-start').value;
  const end = document.getElementById('onb-end').value;
  const errEl = document.getElementById('onb-error');
  errEl.classList.add('hidden');
  try{
    addCycle(start, end);
    showToast('Siklus ditambahkan');
    render();
  }catch(e){
    errEl.textContent = e.message;
    errEl.classList.remove('hidden');
  }
}

/* ---------- Modals ---------- */
function showDayModal(dateStr){
  const status = getDayStatus(dateStr);
  const phase = getCyclePhase(dateStr);
  const modal = document.getElementById('modal-root');
  const phaseHtml = phase ? `
    <div class="day-phase-row" style="--ph:${phase.color};--ph-bg:${phase.bg};--ph-text:${phase.text}">
      <span class="day-phase-dot"></span>
      <span class="day-phase-name">Fase ${phase.name}</span>
      ${phase.estimated ? '<span class="day-phase-est">estimasi</span>' : ''}
    </div>
  ` : '';

  // Big probability block for prob days
  let probBlock = '';
  if(status.type === 'prob'){
    probBlock = `
      <div class="day-prob-block" style="--t:${status.tier.color};--tbg:${status.tier.bg};--ttext:${status.tier.text}">
        <div class="day-prob-label">Perkiraan kemungkinan hamil${status.isPredicted ? ' (prediksi)' : ''}</div>
        <div class="day-prob-value">${fmtProb(status.prob)}</div>
        <div class="day-prob-tier">${status.tier.label} · dari satu kali hubungan tanpa kondom</div>
      </div>`;
  } else {
    probBlock = `<div class="day-status-pill ${status.type === 'period' ? 'period' : 'unknown'}"><span class="swatch"></span>${status.label}</div>`;
  }

  modal.innerHTML = `
    <div class="modal-overlay" data-close-modal>
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-handle"></div>
        <div class="modal-title">${fmtDateLong(dateStr)}</div>
        <div class="modal-subtitle">${dateStr === todayStr() ? 'Hari ini' : ''}</div>
        ${probBlock}
        ${phaseHtml}
        ${status.dayInCycle ? `<div class="text-muted" style="font-size:13px;margin-top:8px">Hari ke-${status.dayInCycle} dalam siklus</div>` : ''}
        ${getDayAdvice(status)}
        <div class="mt-3">
          <button class="btn btn-secondary btn-block" data-close-modal>Tutup</button>
        </div>
      </div>
    </div>
  `;
  modal.querySelectorAll('[data-close-modal]').forEach(el => {
    el.addEventListener('click', closeModal);
  });
}

function getDayAdvice(status){
  if(status.type === 'period'){
    return `<div class="banner banner-info mt-2"><div>Hari haid aktual berdasarkan data Anda. Kesuburan umumnya rendah saat haid, namun pada siklus pendek dapat tidak nol.</div></div>`;
  }
  if(status.type === 'predicted-period'){
    return `<div class="banner banner-info mt-2"><div>Perkiraan hari haid berikutnya berdasarkan rata-rata siklus Anda.</div></div>`;
  }
  if(status.type !== 'prob'){
    return `<div class="banner banner-info mt-2"><div>Belum cukup data untuk mengestimasi hari ini (perlu ≥3 siklus tercatat).</div></div>`;
  }
  // Probability day — advice scales with tier
  const t = status.tier.key;
  const map = {
    vlow:  {cls:'banner-success', txt:'Kemungkinan hamil sangat rendah, namun TIDAK nol — tidak ada hari yang benar-benar tanpa risiko dengan metode kalender.'},
    low:   {cls:'banner-success', txt:'Kemungkinan rendah, tetapi tetap ada. Pada siklus tidak teratur, ovulasi bisa bergeser ke hari ini.'},
    med:   {cls:'banner-warning', txt:'Risiko sedang. Sebaiknya gunakan kondom bila ingin mencegah kehamilan.'},
    high:  {cls:'banner-warning', txt:'Risiko tinggi. Hindari hubungan tanpa pengaman bila tidak menginginkan kehamilan.'},
    vhigh: {cls:'banner-danger',  txt:'Risiko sangat tinggi — mendekati puncak masa subur. Hindari, atau gunakan kondom.'}
  };
  const a = map[t] || map.med;
  const uncertainty = `<br><span style="opacity:0.85;font-size:12px">Angka adalah perkiraan dari pola siklus Anda dan dapat meleset; semakin tidak teratur siklus, semakin besar ketidakpastiannya.</span>`;
  return `<div class="banner ${a.cls} mt-2"><div>${a.txt}${uncertainty}</div></div>`;
}

function showEditCycleModal(id){
  const c = state.cycles.find(x => x.id === id);
  if(!c) return;
  const modal = document.getElementById('modal-root');
  const today = todayStr();
  modal.innerHTML = `
    <div class="modal-overlay" data-close-modal>
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-handle"></div>
        <div class="modal-title">Edit Siklus</div>
        <div class="modal-subtitle">Perbarui tanggal siklus ini</div>
        <div class="form-group">
          <label class="form-label" for="edit-start">Tanggal mulai</label>
          <input type="date" class="form-input" id="edit-start" value="${c.startDate}" max="${today}">
        </div>
        <div class="form-group">
          <label class="form-label" for="edit-end">Tanggal selesai (opsional)</label>
          <input type="date" class="form-input" id="edit-end" value="${c.endDate || ''}" max="${today}">
        </div>
        <div id="edit-error" class="form-error hidden"></div>
        <div class="flex gap-2 mt-2">
          <button class="btn btn-outline" data-close-modal style="flex:1">Batal</button>
          <button class="btn btn-primary" id="edit-save-btn" style="flex:1">Simpan</button>
        </div>
      </div>
    </div>
  `;
  modal.querySelectorAll('[data-close-modal]').forEach(el => {
    el.addEventListener('click', closeModal);
  });
  document.getElementById('edit-save-btn').addEventListener('click', () => {
    const s = document.getElementById('edit-start').value;
    const e = document.getElementById('edit-end').value;
    const errEl = document.getElementById('edit-error');
    errEl.classList.add('hidden');
    try{
      updateCycle(id, s, e);
      closeModal();
      showToast('Siklus diperbarui');
      render();
    }catch(err){
      errEl.textContent = err.message;
      errEl.classList.remove('hidden');
    }
  });
}

function confirmDeleteCycle(id){
  const c = state.cycles.find(x => x.id === id);
  if(!c) return;
  showConfirm({
    title: 'Hapus Siklus?',
    msg: `Siklus mulai ${fmtDateShort(c.startDate)} akan dihapus. Aksi ini tidak dapat dibatalkan.`,
    confirmText: 'Hapus',
    danger: true,
    onConfirm: () => {
      deleteCycle(id);
      showToast('Siklus dihapus');
      render();
    }
  });
}

function confirmResetAll(){
  showConfirm({
    title: 'Reset Semua Data?',
    msg: 'Seluruh siklus tercatat akan dihapus dan Anda akan kembali ke layar onboarding. Aksi ini tidak dapat dibatalkan.',
    confirmText: 'Reset',
    danger: true,
    onConfirm: () => {
      state.cycles = [];
      state.onboardingComplete = false;
      saveData();
      render();
      showToast('Data berhasil direset');
    }
  });
}

function showConfirm({title, msg, confirmText='Konfirmasi', cancelText='Batal', danger=false, onConfirm}){
  const modal = document.getElementById('modal-root');
  modal.innerHTML = `
    <div class="confirm-overlay" data-close-modal>
      <div class="confirm-modal" onclick="event.stopPropagation()">
        <div class="confirm-title">${title}</div>
        <div class="confirm-msg">${msg}</div>
        <div class="confirm-actions">
          <button class="btn btn-outline" data-close-modal>${cancelText}</button>
          <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="confirm-yes-btn">${confirmText}</button>
        </div>
      </div>
    </div>
  `;
  modal.querySelectorAll('[data-close-modal]').forEach(el => {
    el.addEventListener('click', closeModal);
  });
  document.getElementById('confirm-yes-btn').addEventListener('click', () => {
    closeModal();
    if(onConfirm) onConfirm();
  });
}

function closeModal(){
  document.getElementById('modal-root').innerHTML = '';
}

/* ---------- Toast ---------- */
function showToast(msg){
  const existing = document.querySelector('.toast');
  if(existing) existing.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}

/* ---------- Export / Import ---------- */
function exportJSON(){
  const data = {
    app: 'SikluSayang',
    version: 1,
    exportedAt: new Date().toISOString(),
    cycles: state.cycles
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `siklusayang-backup-${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Cadangan JSON diunduh');
}

function exportCSV(){
  const sorted = sortedCycles();
  const rows = [['tanggal_mulai','tanggal_selesai','panjang_haid_hari','panjang_siklus_hari']];
  for(let i = 0; i < sorted.length; i++){
    const c = sorted[i];
    const periodLen = c.endDate ? daysBetween(c.startDate, c.endDate) + 1 : '';
    const cycleLen = (i + 1 < sorted.length)
      ? daysBetween(c.startDate, sorted[i+1].startDate)
      : '';
    rows.push([c.startDate, c.endDate || '', periodLen, cycleLen]);
  }
  const csv = rows.map(r => r.join(',')).join('\n');
  const blob = new Blob(['\ufeff' + csv], {type: 'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `siklusayang-${todayStr()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('CSV diunduh');
}

function handleImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      const data = JSON.parse(ev.target.result);
      if(!data.cycles || !Array.isArray(data.cycles)){
        throw new Error('Format file tidak valid');
      }
      // Validate each
      for(const c of data.cycles){
        if(!c.startDate || !/^\d{4}-\d{2}-\d{2}$/.test(c.startDate)){
          throw new Error('Data siklus tidak valid');
        }
      }
      showConfirm({
        title: 'Impor Data?',
        msg: `${data.cycles.length} siklus akan menggantikan ${state.cycles.length} siklus yang ada saat ini. Lanjutkan?`,
        confirmText: 'Impor',
        danger: false,
        onConfirm: () => {
          state.cycles = data.cycles.map(c => ({
            id: c.id || ('c_' + Date.now() + '_' + Math.random().toString(36).slice(2,7)),
            startDate: c.startDate,
            endDate: c.endDate || null
          }));
          state.onboardingComplete = true;
          saveData();
          render();
          showToast(`${data.cycles.length} siklus berhasil diimpor`);
        }
      });
    }catch(err){
      showToast('Gagal: ' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* ---------- Init ---------- */
render();
</script>
